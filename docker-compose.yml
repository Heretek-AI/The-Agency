      https_proxy: http://docs:${PROXY_PW_DOCS}@egress:3128
      NO_PROXY: localhost,127.0.0.1,egress,dispatcher,verifier
      no_proxy: localhost,127.0.0.1,egress,dispatcher,verifier
    env_file:
      - path: .env.provider
        required: true
      - path: secrets/docs.env
        required: false
    volumes:
      - ./experts/docs/config:/etc/agency:ro,z
      - ${AGENCY_WORKSPACE:-./workspace}:/work:rw,z
      - artifacts:/artifacts
      - docs-data:/home/agent/.local/share/opencode
      - docs-state:/home/agent/.local/state/opencode
      - docs-cache:/home/agent/.cache
  egress:
    container_name: agency-egress
    build:
      context: ./egress
    image: agency-egress:1.0.0
    restart: unless-stopped
    networks:
      - fleet
      - outside
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1
    mem_limit: 1g
    healthcheck:
      test:
        - CMD-SHELL
        - curl -sS -o /dev/null --noproxy '*' http://127.0.0.1:3128/
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    environment:
      PROXY_PW_DIRECTOR: ${PROXY_PW_DIRECTOR}
      PROXY_PW_SCOUT: ${PROXY_PW_SCOUT}
      PROXY_PW_ARCHITECT: ${PROXY_PW_ARCHITECT}
      PROXY_PW_PRODUCT: ${PROXY_PW_PRODUCT}
      PROXY_PW_FRONTEND: ${PROXY_PW_FRONTEND}
      PROXY_PW_BACKEND: ${PROXY_PW_BACKEND}
      PROXY_PW_DBA: ${PROXY_PW_DBA}
      PROXY_PW_PLATFORM: ${PROXY_PW_PLATFORM}
      PROXY_PW_SECURITY: ${PROXY_PW_SECURITY}
      PROXY_PW_QA: ${PROXY_PW_QA}
      PROXY_PW_REVIEWER: ${PROXY_PW_REVIEWER}
      PROXY_PW_DOCS: ${PROXY_PW_DOCS}
    volumes:
      - ./egress/allowlist.txt:/etc/squid/allowlist.txt:ro,z
      - ./egress/squid.conf:/etc/squid/squid.conf:ro,z
networks:
  fleet:
    internal: true
  outside:
    driver: bridge
