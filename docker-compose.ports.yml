# Fallback port publishing for expert debug access (Stage 1d, Step 4).
# Not applied by default: `make up` publishes only the gateway.
# Apply explicitly when direct OpenCode UI access is needed:
#   docker compose -f docker-compose.yml -f docker-compose.ports.yml up -d
# Every mapping stays on the loopback interface.
services:
  director:
    ports: ["127.0.0.1:4111:4096"]
  scout:
